name: Platform Federation Diagnostic
run-name: Platform diagnostic ${{ inputs.definition_sha256 }}
on:
  workflow_dispatch:
    inputs:
      definition:
        description: Tracked platform YAML path on main
        required: true
        default: .config/platform-bootstrap.yaml
        type: string
      definition_sha256:
        description: SHA-256 of the reviewed YAML bytes
        required: true
        type: string
      environments_json:
        description: JSON array of environments declared in the reviewed YAML
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main'
    name: diagnostic-${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environments_json) }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Validate trusted definition
        shell: pwsh
        env:
          DEFINITION: ${{ inputs.definition }}
          EXPECTED_SHA256: ${{ inputs.definition_sha256 }}
        run: |
          if ($env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid definition checksum.' }
          git ls-files --error-unmatch -- $env:DEFINITION | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Definition must be tracked.' }
          if ((Get-FileHash -LiteralPath $env:DEFINITION -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_SHA256) { throw 'Definition checksum mismatch.' }
          ./scripts/Invoke-PlatformBootstrap.ps1 -Definition $env:DEFINITION -Mode Validate
          if ($LASTEXITCODE -ne 0) { throw 'Invalid platform definition.' }
      - name: Authenticate with environment identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3, 2026-09-10
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Verify federation and isolation
        shell: pwsh
        env:
          DEFINITION: ${{ inputs.definition }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: ./scripts/Test-PlatformFederation.ps1 -Definition $env:DEFINITION -Environment $env:TARGET_ENVIRONMENT
