schemaVersion: 1
product: hexagon-template
automation:
  provider: GitHubActions
  repository: example-owner/hexagon-template-devops
  branch: main
azure:
  tenantId: 11111111-1111-1111-1111-111111111111
  subscriptionId: 22222222-2222-2222-2222-222222222222
  location: eastus2
state:
  resourceGroup: rg-hexagon-template-state
  storageAccount: sthexagontemplatestate
  container: tfstate
environments:
  dev:
    identityName: id-hexagon-template-dev-deploy
    resourceGroups:
      - rg-hexagon-template-dev
      - rg-hexagon-template-dev-messaging
    reviewers: []
  staging:
    identityName: id-hexagon-template-staging-deploy
    resourceGroups:
      - rg-hexagon-template-staging
      - rg-hexagon-template-staging-messaging
    reviewers: []
  prod:
    identityName: id-hexagon-template-prod-deploy
    resourceGroups:
      - rg-hexagon-template-prod
      - rg-hexagon-template-prod-messaging
    reviewers:
      - release-reviewer
